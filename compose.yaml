services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-depot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-depot}
      POSTGRES_DB: ${POSTGRES_DB:-depot}
    ports:
      - "5432:5432"
    volumes:
      - depot-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-depot}:${POSTGRES_PASSWORD:-depot}@db:5432/${POSTGRES_DB:-depot}?sslmode=disable"
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  depot-data:
